[package]
name = "opcda-bridge"
version = "0.4.3"
edition.workspace = true
rust-version.workspace = true
description = "Reusable async Rust client library for the opcda-bridge gateway's gRPC API"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/opcda-bridge"
keywords = ["opc", "opc-da", "scada", "industrial", "grpc"]
categories = ["network-programming", "api-bindings", "hardware-support"]

[dependencies]
opcda-bridge-proto.workspace = true
serde.workspace = true
thiserror.workspace = true
tonic.workspace = true
tonic-prost.workspace = true

[dev-dependencies]
anyhow = "1"
regex.workspace = true
toml.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-stream.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["tonic-prost"]
