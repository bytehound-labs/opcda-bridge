syntax = "proto3";

package bridge;

import "google/protobuf/empty.proto";

service Bridge {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc Browse(BrowseRequest) returns (BrowsePage);
  rpc CloseBrowseSession(CloseBrowseSessionRequest) returns (google.protobuf.Empty);
  rpc Search(SearchRequest) returns (stream SearchEvent);
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc GetSearchIndexStatus(GetSearchIndexStatusRequest) returns (SearchIndexStatus);
  rpc RefreshSearchIndex(RefreshSearchIndexRequest) returns (SearchIndexStatus);
  rpc ControlSearchIndex(ControlSearchIndexRequest) returns (SearchIndexStatus);
  rpc SearchIndex(SearchIndexRequest) returns (SearchIndexResponse);
}

message GetCapabilitiesRequest {
  string server = 1;
}

message GetCapabilitiesResponse {
  string application_version = 1;
  string protocol_version = 2;
  uint32 max_page_size = 3;
  bool supports_browse_sessions = 4;
  bool supports_search = 5;
  NamespaceOrganization organization = 6;
  BrowseSource source = 7;
  bool supports_indexed_search = 8;
  string indexed_search_protocol_version = 9;
  uint32 max_indexed_search_results = 10;
  SearchIndexState search_index_state = 11;
}

message ListServersRequest {
  string host = 1;
}

message ListServersResponse {
  repeated string servers = 1;
}

message BrowseRequest {
  string server = 1;
  optional string session_id = 2;
  optional string parent_node_key = 3;
  optional string page_token = 4;
  uint32 page_size = 5;
  bool refresh = 6;
}

message BrowsePage {
  string session_id = 1;
  repeated BrowseNode nodes = 2;
  optional string next_page_token = 3;
  bool complete = 4;
  NamespaceOrganization organization = 5;
  BrowseSource source = 6;
  optional string warning = 7;
}

message BrowseNode {
  string node_key = 1;
  string display_name = 2;
  BrowseNodeKind kind = 3;
  optional string item_id = 4;
}

message CloseBrowseSessionRequest {
  string session_id = 1;
}

enum NamespaceOrganization {
  NAMESPACE_ORGANIZATION_UNSPECIFIED = 0;
  NAMESPACE_ORGANIZATION_FLAT = 1;
  NAMESPACE_ORGANIZATION_HIERARCHICAL = 2;
}

enum BrowseSource {
  BROWSE_SOURCE_UNSPECIFIED = 0;
  BROWSE_SOURCE_DA3 = 1;
  BROWSE_SOURCE_DA2 = 2;
  BROWSE_SOURCE_FLAT = 3;
  BROWSE_SOURCE_DERIVED = 4;
}

enum BrowseNodeKind {
  BROWSE_NODE_KIND_UNSPECIFIED = 0;
  BROWSE_NODE_KIND_BRANCH = 1;
  BROWSE_NODE_KIND_ITEM = 2;
  BROWSE_NODE_KIND_BRANCH_AND_ITEM = 3;
}

message SearchRequest {
  string server = 1;
  string query = 2;
  SearchMatchMode match_mode = 3;
  optional string session_id = 4;
  optional string scope_node_key = 5;
  uint32 max_results = 6;
  bool include_branches = 7;
  bool refresh = 8;
}

enum SearchMatchMode {
  SEARCH_MATCH_MODE_UNSPECIFIED = 0;
  SEARCH_MATCH_MODE_EXACT = 1;
  SEARCH_MATCH_MODE_PREFIX = 2;
  SEARCH_MATCH_MODE_CONTAINS = 3;
}

message SearchEvent {
  oneof event {
    SearchMatch match = 1;
    SearchProgress progress = 2;
    SearchCompleted completed = 3;
  }
}

message SearchMatch {
  BrowseNode node = 1;
  repeated BrowseBreadcrumb breadcrumbs = 2;
}

message BrowseBreadcrumb {
  string node_key = 1;
  string display_name = 2;
}

message SearchProgress {
  uint32 visited_nodes = 1;
  uint32 matches = 2;
  bool partial = 3;
}

message SearchCompleted {
  bool complete = 1;
  bool cancelled = 2;
  bool truncated = 3;
  optional string warning = 4;
}

message GetSearchIndexStatusRequest {
  string server = 1;
}

message RefreshSearchIndexRequest {
  string server = 1;
  bool force = 2;
}

message ControlSearchIndexRequest {
  string server = 1;
  SearchIndexControlAction action = 2;
}

message SearchIndexRequest {
  string server = 1;
  string query = 2;
  SearchMatchMode match_mode = 3;
  uint32 max_results = 4;
}

message SearchIndexStatus {
  string server = 1;
  SearchIndexState state = 2;
  bool configured = 3;
  uint64 active_generation = 4;
  uint64 entry_count = 5;
  uint64 unique_item_count = 6;
  optional string started_at = 7;
  optional string completed_at = 8;
  optional string last_error = 9;
  uint64 database_bytes = 10;
  NamespaceOrganization organization = 11;
  BrowseSource source = 12;
  IndexedSearchProgress progress = 13;
}

message IndexedSearchProgress {
  uint64 branches_visited = 1;
  uint64 entries_seen = 2;
  uint64 unique_items = 3;
  uint64 active_time_ms = 4;
  uint64 paused_time_ms = 5;
  double items_per_second = 6;
  optional uint64 estimated_remaining_ms = 7;
}

message IndexedSearchMatch {
  string item_id = 1;
  string display_name = 2;
  BrowseNodeKind kind = 3;
  repeated string breadcrumbs = 4;
}

message SearchIndexResponse {
  repeated IndexedSearchMatch matches = 1;
  bool has_more = 2;
  SearchIndexStatus status = 3;
}

enum SearchIndexState {
  SEARCH_INDEX_STATE_UNSPECIFIED = 0;
  SEARCH_INDEX_STATE_NOT_INDEXED = 1;
  SEARCH_INDEX_STATE_PARTIAL = 2;
  SEARCH_INDEX_STATE_READY = 3;
  SEARCH_INDEX_STATE_STALE = 4;
  SEARCH_INDEX_STATE_REFRESHING = 5;
  SEARCH_INDEX_STATE_FAILED = 6;
}

enum SearchIndexControlAction {
  SEARCH_INDEX_CONTROL_ACTION_UNSPECIFIED = 0;
  SEARCH_INDEX_CONTROL_ACTION_PAUSE = 1;
  SEARCH_INDEX_CONTROL_ACTION_RESUME = 2;
  SEARCH_INDEX_CONTROL_ACTION_CANCEL = 3;
}

message ReadRequest {
  string server = 1;
  repeated string tag_ids = 2;
}

message ReadResponse {
  repeated TagValue values = 1;
}

message TagValue {
  string tag_id = 1;
  string value = 2;
  string quality = 3;
  string timestamp = 4;
}

message WriteRequest {
  string server = 1;
  string tag_id = 2;
  oneof typed_value {
    string string_value = 3;
    int32 int_value = 4;
    double float_value = 5;
    bool bool_value = 6;
  }
}

message WriteResponse {
  string tag_id = 1;
  bool success = 2;
  optional string error = 3;
}
