syntax = "proto3";

package bridge;

import "google/protobuf/empty.proto";

service Bridge {
  rpc GetGatewayInfo(GetGatewayInfoRequest) returns (GetGatewayInfoResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc Browse(BrowseRequest) returns (BrowsePage);
  rpc CloseBrowseSession(CloseBrowseSessionRequest) returns (google.protobuf.Empty);
  rpc Search(SearchRequest) returns (stream SearchEvent);
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc GetSearchIndexStatus(GetSearchIndexStatusRequest) returns (SearchIndexStatus);
  rpc RefreshSearchIndex(RefreshSearchIndexRequest) returns (SearchIndexStatus);
  rpc ControlSearchIndex(ControlSearchIndexRequest) returns (SearchIndexStatus);
  rpc SearchIndex(SearchIndexRequest) returns (SearchIndexResponse);
}

message GetGatewayInfoRequest {}

message GetGatewayInfoResponse {
  string application_version = 1;
  uint32 compatibility_schema_version = 2;
  repeated ProtocolFeature features = 3;
}

message ProtocolFeature {
  ProtocolFeatureKind kind = 1;
  uint32 min_version = 2;
  uint32 max_version = 3;
}

enum ProtocolFeatureKind {
  PROTOCOL_FEATURE_KIND_UNSPECIFIED = 0;
  PROTOCOL_FEATURE_KIND_CORE = 1;
  PROTOCOL_FEATURE_KIND_NAMESPACE = 2;
  PROTOCOL_FEATURE_KIND_INDEXED_SEARCH = 3;
}

message GetCapabilitiesRequest {
  string server = 1;
}

message GetCapabilitiesResponse {
  string application_version = 1;
  string protocol_version = 2;
  uint32 max_page_size = 3;
  bool supports_browse_sessions = 4;
  bool supports_search = 5;
  NamespaceOrganization organization = 6;
  BrowseSource source = 7;
  bool supports_indexed_search = 8;
  string indexed_search_protocol_version = 9;
  uint32 max_indexed_search_results = 10;
  SearchIndexState search_index_state = 11;
  bool search_index_promoting = 12;
}

message ListServersRequest {
  string host = 1;
}

message ListServersResponse {
  repeated string servers = 1;
}

message BrowseRequest {
  string server = 1;
  optional string session_id = 2;
  optional string parent_node_key = 3;
  optional string page_token = 4;
  uint32 page_size = 5;
  bool refresh = 6;
}

message BrowsePage {
  string session_id = 1;
  repeated BrowseNode nodes = 2;
  optional string next_page_token = 3;
  bool complete = 4;
  NamespaceOrganization organization = 5;
  BrowseSource source = 6;
  optional string warning = 7;
}

message BrowseNode {
  string node_key = 1;
  string display_name = 2;
  BrowseNodeKind kind = 3;
  optional string item_id = 4;
}

message CloseBrowseSessionRequest {
  string session_id = 1;
}

enum NamespaceOrganization {
  NAMESPACE_ORGANIZATION_UNSPECIFIED = 0;
  NAMESPACE_ORGANIZATION_FLAT = 1;
  NAMESPACE_ORGANIZATION_HIERARCHICAL = 2;
}

enum BrowseSource {
  BROWSE_SOURCE_UNSPECIFIED = 0;
  BROWSE_SOURCE_DA3 = 1;
  BROWSE_SOURCE_DA2 = 2;
  BROWSE_SOURCE_FLAT = 3;
  BROWSE_SOURCE_DERIVED = 4;
}

enum BrowseNodeKind {
  BROWSE_NODE_KIND_UNSPECIFIED = 0;
  BROWSE_NODE_KIND_BRANCH = 1;
  BROWSE_NODE_KIND_ITEM = 2;
  BROWSE_NODE_KIND_BRANCH_AND_ITEM = 3;
}

message SearchRequest {
  string server = 1;
  string query = 2;
  SearchMatchMode match_mode = 3;
  optional string session_id = 4;
  optional string scope_node_key = 5;
  uint32 max_results = 6;
  bool include_branches = 7;
  bool refresh = 8;
}

enum SearchMatchMode {
  SEARCH_MATCH_MODE_UNSPECIFIED = 0;
  SEARCH_MATCH_MODE_EXACT = 1;
  SEARCH_MATCH_MODE_PREFIX = 2;
  SEARCH_MATCH_MODE_CONTAINS = 3;
}

message SearchEvent {
  oneof event {
    SearchMatch match = 1;
    SearchProgress progress = 2;
    SearchCompleted completed = 3;
  }
}

message SearchMatch {
  BrowseNode node = 1;
  repeated BrowseBreadcrumb breadcrumbs = 2;
}

message BrowseBreadcrumb {
  string node_key = 1;
  string display_name = 2;
}

message SearchProgress {
  uint32 visited_nodes = 1;
  uint32 matches = 2;
  bool partial = 3;
}

message SearchCompleted {
  bool complete = 1;
  bool cancelled = 2;
  bool truncated = 3;
  optional string warning = 4;
}

message GetSearchIndexStatusRequest {
  string server = 1;
}

message RefreshSearchIndexRequest {
  string server = 1;
  bool force = 2;
}

message ControlSearchIndexRequest {
  string server = 1;
  SearchIndexControlAction action = 2;
}

message SearchIndexRequest {
  string server = 1;
  string query = 2;
  SearchMatchMode match_mode = 3;
  uint32 max_results = 4;
}

message SearchIndexStatus {
  string server = 1;
  SearchIndexState state = 2;
  bool configured = 3;
  uint64 active_generation = 4;
  uint64 entry_count = 5;
  uint64 unique_item_count = 6;
  optional string started_at = 7;
  optional string completed_at = 8;
  optional string last_error = 9;
  uint64 database_bytes = 10;
  NamespaceOrganization organization = 11;
  BrowseSource source = 12;
  IndexedSearchProgress progress = 13;
  optional IndexInventoryLimits effective_limits = 14;
  IndexControllerState controller_state = 15;
  optional IndexPauseReason pause_reason = 16;
  optional string recovery_deadline = 17;
  IndexForegroundDiagnostics foreground = 18;
  IndexHostDiagnostics host = 19;
  IndexStorageDiagnostics storage = 20;
  IndexSchedulerDiagnostics scheduler = 21;
  IndexHealthDiagnostics health = 22;
  bool promoting = 23;
  optional string pause_reason_detail = 24;
}

message IndexInventoryLimits {
  uint32 item_rate_per_second = 1;
  uint32 batch_size = 2;
  uint32 duty_cycle_percent = 3;
}

message IndexForegroundDiagnostics {
  uint64 active_count = 1;
  uint64 operations = 2;
  uint64 errors = 3;
  uint64 bad_quality = 4;
  optional uint64 latency_p50_ms = 5;
  optional uint64 latency_p95_ms = 6;
  optional uint64 latency_max_ms = 7;
  bool last_error = 8;
  bool last_bad_quality = 9;
}

message IndexHostDiagnostics {
  optional double cpu_percent = 1;
  optional double available_memory_percent = 2;
  optional double disk_active_percent = 3;
  optional double disk_queue = 4;
  optional uint64 process_working_set_bytes = 5;
  optional uint64 process_private_bytes = 6;
  optional uint64 process_read_bytes_per_second = 7;
  optional uint64 process_write_bytes_per_second = 8;
  optional uint64 disk_free_bytes = 9;
}

message IndexStorageDiagnostics {
  uint64 main_bytes = 1;
  uint64 wal_bytes = 2;
  uint64 shm_bytes = 3;
  optional uint64 free_bytes = 4;
  optional uint64 last_commit_latency_ms = 5;
}

message IndexSchedulerDiagnostics {
  optional string next_refresh_at = 1;
  optional string last_attempt_at = 2;
  optional string last_success_at = 3;
  optional uint64 last_success_duration_ms = 4;
  optional string retry_after = 5;
  uint32 consecutive_failures = 6;
  bool circuit_open = 7;
}

message IndexHealthDiagnostics {
  IndexHealthState state = 1;
  bool sentinel_configured = 2;
}

message IndexedSearchProgress {
  uint64 branches_visited = 1;
  uint64 entries_seen = 2;
  uint64 unique_items = 3;
  uint64 active_time_ms = 4;
  uint64 paused_time_ms = 5;
  double items_per_second = 6;
  optional uint64 estimated_remaining_ms = 7;
}

message IndexedSearchMatch {
  string item_id = 1;
  string display_name = 2;
  BrowseNodeKind kind = 3;
  repeated string breadcrumbs = 4;
}

message SearchIndexResponse {
  repeated IndexedSearchMatch matches = 1;
  bool has_more = 2;
  SearchIndexStatus status = 3;
}

enum SearchIndexState {
  SEARCH_INDEX_STATE_UNSPECIFIED = 0;
  SEARCH_INDEX_STATE_NOT_INDEXED = 1;
  SEARCH_INDEX_STATE_PARTIAL = 2;
  SEARCH_INDEX_STATE_READY = 3;
  SEARCH_INDEX_STATE_STALE = 4;
  SEARCH_INDEX_STATE_REFRESHING = 5;
  SEARCH_INDEX_STATE_FAILED = 6;
  // Deprecated on the wire: gateways map promotion to REFRESHING and set the
  // additive promoting diagnostic so older clients remain compatible.
  SEARCH_INDEX_STATE_PROMOTING = 7;
}

enum SearchIndexControlAction {
  SEARCH_INDEX_CONTROL_ACTION_UNSPECIFIED = 0;
  SEARCH_INDEX_CONTROL_ACTION_PAUSE = 1;
  SEARCH_INDEX_CONTROL_ACTION_RESUME = 2;
  SEARCH_INDEX_CONTROL_ACTION_CANCEL = 3;
}

enum IndexControllerState {
  INDEX_CONTROLLER_STATE_UNSPECIFIED = 0;
  INDEX_CONTROLLER_STATE_RAMPING = 1;
  INDEX_CONTROLLER_STATE_STEADY = 2;
  INDEX_CONTROLLER_STATE_THROTTLED = 3;
  INDEX_CONTROLLER_STATE_PAUSED = 4;
}

enum IndexPauseReason {
  INDEX_PAUSE_REASON_UNSPECIFIED = 0;
  INDEX_PAUSE_REASON_FOREGROUND = 1;
  INDEX_PAUSE_REASON_OPC_HEALTH = 2;
  INDEX_PAUSE_REASON_HOST_CPU = 3;
  INDEX_PAUSE_REASON_MEMORY = 4;
  INDEX_PAUSE_REASON_DISK = 5;
  INDEX_PAUSE_REASON_DATABASE = 6;
  INDEX_PAUSE_REASON_OPERATOR = 7;
  INDEX_PAUSE_REASON_CIRCUIT = 8;
}

enum IndexHealthState {
  INDEX_HEALTH_STATE_UNSPECIFIED = 0;
  INDEX_HEALTH_STATE_HEALTHY = 1;
  INDEX_HEALTH_STATE_UNHEALTHY = 2;
  INDEX_HEALTH_STATE_UNAVAILABLE = 3;
}

message ReadRequest {
  string server = 1;
  repeated string tag_ids = 2;
}

message ReadResponse {
  repeated TagValue values = 1;
}

message TagValue {
  string tag_id = 1;
  // Semantic textual value. For an OPC DA VT_BSTR, this is the exact BSTR
  // content; quote characters are data only when they are present in the BSTR.
  string value = 2;
  string quality = 3;
  string timestamp = 4;
}

message WriteRequest {
  string server = 1;
  string tag_id = 2;
  oneof typed_value {
    string string_value = 3;
    int32 int_value = 4;
    double float_value = 5;
    bool bool_value = 6;
  }
}

message WriteResponse {
  string tag_id = 1;
  bool success = 2;
  optional string error = 3;
}
