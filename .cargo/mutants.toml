# Shared defaults for local and CI mutation runs.
all_features = true
additional_cargo_args = ["--locked"]
minimum_test_timeout = 20.0

# These mutations are equivalent for the constrained values represented by the
# compatibility evaluator:
# - the equality boundary in negotiated_version selects the same value on either
#   branch, so replacing > with >= has no observable effect;
# - all exact-pair rows in the current compatibility catalog have the same
#   evidence status, so selecting a different exact client row has no observable
#   effect. Remove the latter if those statuses ever diverge.
exclude_re = [
    'compatibility.rs:74:30: replace > with >= in ProtocolVersionRange::negotiated_version',
    'compatibility.rs:266:29: replace == with != in catalog_evidence',
]
