name: Release-plz

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: protoc

      - name: Enforce release rate limit
        run: python3 scripts/release-rate-limit.py

      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        with:
          command: release
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Synchronize compatibility test lockfile after release
        shell: bash
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          release_commit_re='^chore(\([^)]*\))?!?:[[:space:]]release([[:space:]]|$)'
          subject="$(git log -1 --format=%s)"
          if [[ ! "$subject" =~ $release_commit_re ]]; then
            echo "The current commit is not a release commit; no compatibility lockfile sync is needed."
            exit 0
          fi

          cargo generate-lockfile --manifest-path compatibility-tests/Cargo.toml
          if git diff --quiet -- compatibility-tests/Cargo.lock; then
            echo "The compatibility test lockfile already matches the released package versions."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compatibility-tests/Cargo.lock
          git commit -m "chore: sync compatibility test lockfile"
          git push "https://x-access-token:${RELEASE_PLZ_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: protoc

      - name: Identify release commit
        id: release-commit
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          release_commit_re='^chore(\([^)]*\))?!?:[[:space:]]release([[:space:]]|$)'
          if [[ "$subject" =~ $release_commit_re ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The current commit is already a release commit; skipping release-pr."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce release rate limit
        if: steps.release-commit.outputs.skip != 'true'
        run: python3 scripts/release-rate-limit.py

      - name: Create release PR
        if: steps.release-commit.outputs.skip != 'true'
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        with:
          command: release-pr
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
