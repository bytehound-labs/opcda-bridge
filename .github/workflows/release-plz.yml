name: Release-plz

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: protoc

      - name: Enforce release rate limit
        run: python3 scripts/release-rate-limit.py

      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        with:
          command: release
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: protoc

      - name: Identify release commit
        id: release-commit
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          release_commit_re='^chore(\([^)]*\))?!?:[[:space:]]release([[:space:]]|$)'
          if [[ "$subject" =~ $release_commit_re ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The current commit is already a release commit; skipping release-pr."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce release rate limit
        if: steps.release-commit.outputs.skip != 'true'
        run: python3 scripts/release-rate-limit.py

      - name: Create release PR
        if: steps.release-commit.outputs.skip != 'true'
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        with:
          command: release-pr
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
