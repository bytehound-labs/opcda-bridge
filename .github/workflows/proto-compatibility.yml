name: Protobuf compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: proto-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto:
    name: Required Protobuf compatibility status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Buf
        uses: bufbuild/buf-setup-action@fbb91772b52752bd36ca8552d2ff4b94e111f24f # main
        with:
          version: 1.50.0

      - name: Lint Protobuf schema
        run: buf lint

      - name: Check Protobuf formatting
        run: buf format --diff --exit-code

      - name: Fetch default branch baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Check Protobuf compatibility
        run: buf breaking --against '.git#ref=refs/remotes/origin/main'
