name: Temporary yank of unintended v0.3.1 crates

on:
  workflow_dispatch:

permissions: {}

jobs:
  yank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Yank unintended versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in \
            opcda-bridge \
            opcda-bridge-proto \
            opcda-bridge-gateway \
            opcda-bridge-client
          do
            cargo yank --vers 0.3.1 "$crate"
          done
