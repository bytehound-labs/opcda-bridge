name: Temporary crate cleanup

on:
  workflow_dispatch:

permissions: {}

jobs:
  yank-spurious-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Yank spurious crate versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          crates=(
            opcda-bridge
            opcda-bridge-proto
            opcda-bridge-client
            opcda-bridge-gateway
          )
          versions=(0.2.3 0.2.4 0.2.5 0.2.6 0.2.7 0.2.8 0.2.9 0.2.10 0.2.11 0.2.12 0.2.13)
          for crate in "${crates[@]}"; do
            for version in "${versions[@]}"; do
              echo "Yanking ${crate} ${version}"
              cargo yank --quiet --version "$version" "$crate"
            done
          done
