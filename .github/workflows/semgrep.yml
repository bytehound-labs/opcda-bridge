name: Semgrep

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 4 * * 1'

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Semgrep changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.semgrep == 'true' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            semgrep:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'scripts/**'
              - 'crates/**/*.rs'
              - 'crates/**/build.rs'
              - 'crates/**/Cargo.toml'
              - 'crates/**/proto/**'
              - 'fuzz/**'
              - '.github/workflows/**'

  semgrep:
    name: Semgrep Rust analysis
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'semgrep==1.174.0'

      - name: Scan Rust sources
        run: |
          semgrep scan \
            --jobs 1 \
            --config p/rust \
            --error \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: semgrep.sarif

  security:
    name: Required Semgrep status
    if: always()
    needs: [changes, semgrep]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail if change detection failed
        if: needs.changes.result != 'success'
        run: |
          echo "Semgrep change detection did not complete successfully."
          exit 1

      - name: Report skipped analysis
        if: needs.changes.outputs.run != 'true'
        run: echo "No Semgrep-affecting files changed; analysis skipped."

      - name: Verify analysis result
        if: needs.changes.outputs.run == 'true' && needs.semgrep.result != 'success'
        run: |
          echo "Semgrep ended with: ${{ needs.semgrep.result }}"
          exit 1
