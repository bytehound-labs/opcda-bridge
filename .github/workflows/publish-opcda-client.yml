name: Publish ByteHound OPC DA client

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref in bytehound-labs/opc-cli to publish
        required: true
        default: main
        type: string
      dry_run:
        description: Validate packaging without publishing to crates.io
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  publish:
    name: Publish bytehound-opc-da-client
    # The crate links the Windows COM bindings unconditionally, so package
    # verification must run on a Windows host rather than Linux.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bytehound-labs/opc-cli
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run package tests
        run: cargo test -p bytehound-opc-da-client --locked

      - name: Verify publish package
        # crates.io trusted publishing is not configured for the external fork.
        # zizmor: ignore[use-trusted-publishing]
        run: cargo publish -p bytehound-opc-da-client --locked --dry-run

      - name: Publish package
        if: inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # zizmor: ignore[use-trusted-publishing]
        run: cargo publish -p bytehound-opc-da-client --locked
