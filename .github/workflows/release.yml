name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'opcda-bridge-gateway-v*'
      - 'opcda-bridge-client-v*'

jobs:
  release-gateway:
    if: startsWith(github.ref_name, 'opcda-bridge-gateway-v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: opcda-bridge-gateway
          manifest_path: gateway/Cargo.toml
          target: i686-pc-windows-msvc
          archive: opcda-bridge-gateway-windows-x86
          token: ${{ secrets.GITHUB_TOKEN }}

  release-client:
    if: startsWith(github.ref_name, 'opcda-bridge-client-v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: opcda-bridge-client-linux-x86_64
          - os: macos-latest
            archive: opcda-bridge-client-macos-arm64
          - os: windows-latest
            archive: opcda-bridge-client-windows-x86_64
      max-parallel: 1
    steps:
      - uses: actions/checkout@v5

      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: opcda-bridge-client
          manifest_path: client/Cargo.toml
          archive: ${{ matrix.archive }}
          token: ${{ secrets.GITHUB_TOKEN }}

  aur-publish:
    needs: release-client
    # AUR publishing is paused until aur.archlinux.org's outage clears (an
    # ongoing DDoS-related outage starting 2026-08-01; see
    # https://archlinux.org/news/recent-services-outages/). This job would
    # otherwise fail on every client release with "The AUR is down due to
    # maintenance", spamming failure notifications for something outside
    # this repo's control. Restore the condition below once AUR is back:
    #   if: startsWith(github.ref_name, 'opcda-bridge-client-v')
    if: false
    uses: ./.github/workflows/aur-publish.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
