name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,protoc

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Run cargo-deny
        run: cargo deny check

      - name: Check for unused dependencies
        run: cargo machete

      - name: Build gateway (release, 32-bit)
        run: cargo build -p opcda-bridge-gateway --release --target i686-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: opcda-bridge-gateway
          path: target/i686-pc-windows-msvc/release/opcda-bridge-gateway.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: Swatinem/rust-cache@v2

      - name: Run Linux tests
        run: cargo test --workspace --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: Swatinem/rust-cache@v2

      - name: Verify publishable packages
        run: cargo package --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - uses: Swatinem/rust-cache@v2

      - name: Check the declared MSRV
        run: cargo check --workspace --all-targets --locked
