name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect coverage changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.coverage == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            coverage:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
              - 'crates/**/*.rs'
              - 'crates/**/build.rs'
              - 'crates/**/Cargo.toml'
              - 'crates/**/proto/**'

  coverage_run:
    name: Generate coverage
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,protoc

      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  coverage:
    if: always()
    needs: [changes, coverage_run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if change detection failed
        if: needs.changes.result != 'success'
        run: |
          echo "Change detection did not complete successfully."
          exit 1

      - name: Report skipped coverage
        if: needs.changes.outputs.run != 'true'
        run: echo "No coverage-affecting files changed; coverage generation skipped."

      - name: Verify coverage result
        if: needs.changes.outputs.run == 'true' && needs.coverage_run.result != 'success'
        run: |
          echo "Coverage ended with: ${{ needs.coverage_run.result }}"
          exit 1
