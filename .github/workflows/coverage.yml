name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,protoc

      - uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # fail_ci_if_error is false since this repo transferred from
      # mikeboiko/opcda-bridge to bytehound-labs/opcda-bridge: Codecov
      # doesn't recognize the repo under its new owner and rejects
      # tokenless uploads on a protected branch ("Token required - not
      # valid tokenless upload"). Re-add/re-sync bytehound-labs/opcda-bridge
      # on codecov.io, add its token as the CODECOV_TOKEN repo secret, then
      # restore fail_ci_if_error: true.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
