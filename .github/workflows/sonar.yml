name: SonarQube

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 4 * * 3'

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect SonarQube changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.sonar == 'true' }}
      fork: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            sonar:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'sonar-project.properties'
              - 'build.rs'
              - 'crates/**'
              - 'compatibility-tests/**'
              - 'fuzz/**'
              - 'scripts/**'
              - '.github/workflows/**'

  analyze:
    name: SonarQube analysis
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      needs.changes.outputs.fork != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          components: clippy,llvm-tools-preview

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-llvm-cov,protoc

      - name: Generate Rust coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Report SonarQube task failure
        if: failure() && hashFiles('.scannerwork/report-task.txt') != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          ce_task_url="$(sed -n 's/^ceTaskUrl=//p' .scannerwork/report-task.txt)"
          if [ -z "$ce_task_url" ]; then
            echo "SonarQube did not write a compute-engine task URL."
            exit 0
          fi
          case "$ce_task_url" in
            *\?*) ce_task_url="${ce_task_url}&organization=bytehound-labs" ;;
            *) ce_task_url="${ce_task_url}?organization=bytehound-labs" ;;
          esac

          task_response="$(mktemp)"
          projects_response="$(mktemp)"
          trap 'rm -f "$task_response" "$projects_response"' EXIT

          task_http_status="$(
            curl --silent --show-error --user "$SONAR_TOKEN:" \
              --output "$task_response" --write-out '%{http_code}' "$ce_task_url"
          )"
          echo "SonarQube task response (HTTP ${task_http_status}):"
          if jq empty "$task_response" >/dev/null 2>&1; then
            jq . "$task_response"
          else
            cat "$task_response"
          fi

          projects_http_status="$(
            curl --silent --show-error --user "$SONAR_TOKEN:" \
              --get --data-urlencode 'organization=bytehound-labs' \
              --data-urlencode 'ps=500' \
              --output "$projects_response" --write-out '%{http_code}' \
              'https://sonarcloud.io/api/projects/search'
          )"
          echo "SonarQube projects visible to the analysis token (HTTP ${projects_http_status}):"
          if jq empty "$projects_response" >/dev/null 2>&1; then
            jq '{components: [.components[]? | {key, name, qualifier}]}' "$projects_response"
          else
            cat "$projects_response"
          fi

  status:
    name: Required Sonar quality status
    if: always()
    needs: [changes, analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if change detection failed
        if: needs.changes.result != 'success'
        run: |
          echo "SonarQube change detection did not complete successfully."
          exit 1

      - name: Report skipped analysis
        if: needs.changes.outputs.run != 'true'
        run: echo "No SonarQube-affecting files changed; analysis skipped."

      - name: Report fork pull request skip
        if: needs.changes.outputs.run == 'true' && needs.changes.outputs.fork == 'true'
        run: echo "SonarQube analysis skipped for a fork pull request because repository secrets are unavailable."

      - name: Verify analysis result
        if: needs.changes.outputs.run == 'true' && needs.changes.outputs.fork != 'true' && needs.analyze.result != 'success'
        run: |
          echo "SonarQube analysis ended with: ${{ needs.analyze.result }}"
          exit 1
