name: AUR Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. opcda-bridge-client-v0.1.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Check for AUR key
        id: check-key
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUR_SSH_PRIVATE_KEY not configured, skipping AUR publish"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Derive package version
        id: version
        if: steps.check-key.outputs.configured == 'true'
        run: |
          echo "value=${RELEASE_TAG#opcda-bridge-client-}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Download Linux release asset
        if: steps.check-key.outputs.configured == 'true'
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --pattern "opcda-bridge-client-linux-*" \
            --dir assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute checksums
        if: steps.check-key.outputs.configured == 'true'
        run: |
          ARCHIVE=$(ls assets/opcda-bridge-client-linux-*.tar.gz)
          {
            echo "ARCHIVE_SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
            echo "LICENSE_SHA=$(sha256sum LICENSE | cut -d' ' -f1)"
            echo "README_SHA=$(sha256sum README.md | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Generate PKGBUILD and .SRCINFO
        if: steps.check-key.outputs.configured == 'true'
        run: |
          bash scripts/aurpkg \
            --version "${{ steps.version.outputs.value }}" \
            --pkgrel 1 \
            --license-sha256 "$LICENSE_SHA" \
            --readme-sha256 "$README_SHA" \
            --x86_64-sha256 "$ARCHIVE_SHA" \
            --output-dir aur-repo

      - name: Setup SSH for AUR
        if: steps.check-key.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to AUR
        if: steps.check-key.outputs.configured == 'true'
        run: |
          PKGVER="${VERSION#v}"
          PKGREL=1
          git clone ssh://aur@aur.archlinux.org/opcda-bridge-client-bin.git aur-clone
          cp aur-repo/* aur-clone/
          cd aur-clone
          if git diff --quiet; then
            echo "No changes to AUR package"
            exit 0
          fi
          git add PKGBUILD .SRCINFO
          git commit -m "upgpkg: opcda-bridge-client-bin ${PKGVER}-$PKGREL"
          git push origin HEAD
        env:
          VERSION: ${{ steps.version.outputs.value }}
