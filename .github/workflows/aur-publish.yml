name: AUR Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. opcda-bridge-client-v0.1.0)'
        required: true
        type: string
      pkgrel:
        description: 'Arch package release number (bump for packaging-only fixes)'
        required: false
        default: '1'
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      pkgrel:
        required: false
        default: '1'
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for AUR key
        id: check-key
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUR_SSH_PRIVATE_KEY not configured, skipping AUR publish"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Derive package version
        id: version
        if: steps.check-key.outputs.configured == 'true'
        run: |
          echo "value=${RELEASE_TAG#opcda-bridge-client-}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Download Linux release asset
        if: steps.check-key.outputs.configured == 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern "opcda-bridge-client-linux-*" \
            --dir assets

      - name: Compute checksums
        if: steps.check-key.outputs.configured == 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          ARCHIVE=$(ls assets/opcda-bridge-client-linux-*.tar.gz)
          {
            echo "ARCHIVE_SHA=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
            echo "LICENSE_SHA=$(git show "${RELEASE_TAG}:LICENSE" | sha256sum | cut -d' ' -f1)"
            echo "README_SHA=$(git show "${RELEASE_TAG}:README.md" | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Generate PKGBUILD and .SRCINFO
        if: steps.check-key.outputs.configured == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          bash scripts/aurpkg \
            --version "$VERSION" \
            --pkgrel "$PKGREL" \
            --license-sha256 "$LICENSE_SHA" \
            --readme-sha256 "$README_SHA" \
            --x86_64-sha256 "$ARCHIVE_SHA" \
            --output-dir aur-repo

      - name: Setup SSH for AUR
        if: steps.check-key.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to AUR
        if: steps.check-key.outputs.configured == 'true'
        run: |
          PKGVER="${VERSION#v}"
          git clone ssh://aur@aur.archlinux.org/opcda-bridge-client-bin.git aur-clone
          cp aur-repo/PKGBUILD aur-repo/.SRCINFO aur-clone/
          cd aur-clone
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to AUR package"
            exit 0
          fi
          git commit -m "upgpkg: opcda-bridge-client-bin ${PKGVER}-${PKGREL}"
          git push origin HEAD
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PKGREL: ${{ inputs.pkgrel }}
