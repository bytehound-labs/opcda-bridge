name: Cargo Mutants

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to mutate
        required: true
        default: all
        type: choice
        options:
          - all
          - opcda-bridge
          - opcda-bridge-client
          - opcda-bridge-proto
          - opcda-bridge-gateway
  schedule:
    - cron: '17 3 * * 6'

concurrency:
  group: cargo-mutants-${{ github.ref }}-${{ inputs.package || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    name: Select mutation packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - name: Resolve package selector
        id: packages
        env:
          PACKAGE: ${{ inputs.package || 'all' }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            all)
              matrix='{"include":[{"package":"opcda-bridge","os":"ubuntu-latest"},{"package":"opcda-bridge-client","os":"ubuntu-latest"},{"package":"opcda-bridge-proto","os":"ubuntu-latest"},{"package":"opcda-bridge-gateway","os":"windows-latest"}]}'
              ;;
            opcda-bridge|opcda-bridge-client|opcda-bridge-proto)
              matrix="{\"include\":[{\"package\":\"$PACKAGE\",\"os\":\"ubuntu-latest\"}]}"
              ;;
            opcda-bridge-gateway)
              matrix='{"include":[{"package":"opcda-bridge-gateway","os":"windows-latest"}]}'
              ;;
            *)
              echo "::error::Unsupported package selector: $PACKAGE"
              exit 1
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutate:
    name: Mutation testing (${{ matrix.package }})
    needs: select
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-mutants@27.1.0,protoc

      - name: Run cargo-mutants on Unix
        if: matrix.os == 'ubuntu-latest'
        env:
          PACKAGE: ${{ matrix.package }}
        run: cargo mutants --package "$PACKAGE" --in-place --no-shuffle --timeout 180

      - name: Run cargo-mutants on Windows
        if: matrix.os == 'windows-latest'
        env:
          PACKAGE: ${{ matrix.package }}
        shell: pwsh
        run: cargo mutants --package "$env:PACKAGE" --in-place --no-shuffle --timeout 180

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-mutants-${{ matrix.package }}-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14
