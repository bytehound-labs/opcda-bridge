[package]
name = "opcda-bridge-gateway"
version = "0.1.0"
edition = "2024"
description = "OPC DA gateway (Windows COM server)"
license = "MIT"
repository = "https://github.com/mikeboiko/opcda-bridge"

[dependencies]
bridge-proto = { path = "../bridge-proto" }
opcda-bridge = { path = ".." }
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
anyhow = "1"
async-trait = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
opc-da-client = "0.1"

[package.metadata.cargo-machete]
ignored = ["tonic-prost"]
