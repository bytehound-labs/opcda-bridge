[package]
name = "opcda-bridge-gateway"
version = "0.1.4"
edition = "2024"
description = "OPC DA gateway (Windows COM server)"
license = "MIT"
repository = "https://github.com/mikeboiko/opcda-bridge"

[dependencies]
bridge-proto = { path = "../bridge-proto", version = "0.1.0" }
opcda-bridge = { path = "..", version = "0.1.4" }
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tokio-stream = "0.1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(target_os = "windows")'.dependencies]
opc-da-client = "0.1"
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"

[package.metadata.cargo-machete]
ignored = ["tonic-prost"]
