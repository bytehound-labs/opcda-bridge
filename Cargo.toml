[workspace]
members = [
  "crates/opcda-bridge",
  "crates/opcda-bridge-client",
  "crates/opcda-bridge-gateway",
  "crates/opcda-bridge-proto",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/bytehound-labs/opcda-bridge"
homepage = "https://github.com/bytehound-labs/opcda-bridge"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
clap = { version = "4", features = ["derive", "env"] }
opc-da-client = { package = "bytehound-opc-da-client", version = "0.3.1" }
opcda-bridge = { path = "crates/opcda-bridge", version = "0.6" }
opcda-bridge-proto = { path = "crates/opcda-bridge-proto", version = "0.6" }
prost = "0.14"
proptest = "1.11"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.19"
tempfile = "3"
thiserror = "2"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
rust_2018_idioms = { level = "warn", priority = -1 }
redundant_lifetimes = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
used_underscore_binding = "warn"
