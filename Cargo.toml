[workspace]
members = [
  "crates/opcda-bridge",
  "crates/opcda-bridge-client",
  "crates/opcda-bridge-gateway",
  "crates/opcda-bridge-proto",
]
resolver = "2"

[workspace.package]
version = "0.2.6"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/bytehound-labs/opcda-bridge"
homepage = "https://github.com/bytehound-labs/opcda-bridge"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
# Keep recursive browsing for hierarchical OPC DA servers. The 0.1.2+ OPC_FLAT
# fast path accepts branch-only results from some servers (including Yokogawa
# CSHIS) as complete item IDs, so it cannot represent their child tags.
opc-da-client = "=0.1.1"
opcda-bridge = { path = "crates/opcda-bridge", version = "0.2" }
opcda-bridge-proto = { path = "crates/opcda-bridge-proto", version = "0.2" }
prost = "0.14"
proptest = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.19"
tempfile = "3"
thiserror = "2"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
windows-service = "0.8"
