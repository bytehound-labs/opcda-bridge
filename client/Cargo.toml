[package]
name = "opcda-bridge-client"
version = "0.1.0"
edition = "2024"
description = "OPC DA cross-platform client"
license = "MIT"
repository = "https://github.com/mikeboiko/opcda-bridge"

[dependencies]
bridge-proto = { path = "../bridge-proto", version = "0.1.0" }
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tabled = "0.19"

[package.metadata.cargo-machete]
ignored = ["tonic", "tonic-prost"]
